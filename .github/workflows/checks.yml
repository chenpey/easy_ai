name: checks

on:
  push:
  pull_request:

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 仓库门禁
            working_directory: .
            command: bash scripts/check.sh
            install_pyyaml: true
            timeout_minutes: 5
          - name: 安装脚本冒烟测试
            working_directory: .
            command: bash scripts/smoke-install.sh
            install_pyyaml: false
            timeout_minutes: 5
          - name: 版本提取门禁
            working_directory: .
            command: bash easydev/tests/cases/version-gate/run.sh
            install_pyyaml: true
            timeout_minutes: 5
          - name: 流程状态机与设计门禁
            working_directory: .
            command: bash easydev/tests/cases/design-gate/run.sh
            install_pyyaml: false
            timeout_minutes: 5
          - name: audit 上限与分片覆盖
            working_directory: .
            command: bash easydev/tests/cases/audit-overflow/run.sh
            install_pyyaml: false
            timeout_minutes: 5
          - name: 固定补丁复验
            working_directory: easydev
            command: bash tests/cases/public-contract-callers/run.sh
            install_pyyaml: false
            timeout_minutes: 5
          - name: 按角色计量回归
            install_pytest: true
            working_directory: easydev
            command: python3 -m pytest tests/experiments/test_role_metric.py
            install_pyyaml: false
            timeout_minutes: 5
          - name: 行为 runner 与进程清理回归
            install_pytest: true
            working_directory: easydev
            command: python3 -m pytest tests/experiments/agent_runner
            install_pyyaml: false
            install_ripgrep: true
            timeout_minutes: 10
          - name: SWE-bench runner 与事件归因回归
            install_pytest: true
            working_directory: easydev
            command: python3 -m pytest tests/experiments/swebench
            install_pyyaml: false
            timeout_minutes: 10
          - name: 可选 Hook Plugin 离线回归
            install_pytest: true
            working_directory: easydev
            command: python3 -m pytest tests/hooks
            install_pyyaml: false
            timeout_minutes: 10
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyYAML（仅有 PyYAML 分支的检查）
        if: matrix.install_pyyaml
        run: python -m pip install --quiet pyyaml

      - name: 安装 pytest（测试矩阵作业）
        if: matrix.install_pytest
        run: python -m pip install --quiet "pytest==8.4.2"

      - name: 安装 ripgrep（仅真实 rg 正例的检查）
        if: matrix.install_ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ripgrep

      - name: 执行矩阵检查
        working-directory: ${{ matrix.working_directory }}
        run: ${{ matrix.command }}

  powershell-syntax:
    name: PowerShell 语法门禁
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 解析 sync-agent-rules.ps1
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/sync-agent-rules.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Output "OK: scripts/sync-agent-rules.ps1 语法合法"
