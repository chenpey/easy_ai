name: checks

on:
  push:
  pull_request:

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 仓库门禁
            working_directory: .
            command: bash scripts/check.sh
            install_pyyaml: true
            timeout_minutes: 5
          - name: 安装脚本冒烟测试
            working_directory: .
            command: bash scripts/smoke-install.sh
            install_pyyaml: false
            timeout_minutes: 5
          - name: 版本提取门禁
            working_directory: .
            command: bash easydev/tests/cases/version-gate/run.sh
            install_pyyaml: true
            timeout_minutes: 5
          - name: 流程状态机与设计门禁
            working_directory: .
            command: bash easydev/tests/cases/design-gate/run.sh
            install_pyyaml: false
            timeout_minutes: 5
          - name: audit 上限与分片覆盖
            working_directory: .
            command: bash easydev/tests/cases/audit-overflow/run.sh
            install_pyyaml: false
            timeout_minutes: 5
          - name: 固定补丁复验
            working_directory: easydev
            command: bash tests/cases/public-contract-callers/run.sh
            install_pyyaml: false
            timeout_minutes: 5
          - name: 按角色计量回归
            working_directory: easydev
            command: python3 -m unittest discover -s tests/experiments -p 'test_role_metric.py'
            install_pyyaml: false
            timeout_minutes: 5
          - name: 行为 runner 与进程清理回归
            working_directory: easydev
            command: python3 -m unittest discover -s tests/experiments/agent_runner -p 'test_*.py'
            install_pyyaml: false
            timeout_minutes: 10
          - name: SWE-bench runner 与事件归因回归
            working_directory: easydev
            command: python3 -m unittest discover -s tests/experiments/swebench -p 'test_*.py'
            install_pyyaml: false
            timeout_minutes: 10
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyYAML（仅有 PyYAML 分支的检查）
        if: matrix.install_pyyaml
        run: python -m pip install --quiet pyyaml

      - name: 执行矩阵检查
        working-directory: ${{ matrix.working_directory }}
        run: ${{ matrix.command }}
