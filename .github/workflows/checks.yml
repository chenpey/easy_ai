name: checks

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyYAML（缺失时 check.sh 会降级为严格校验）
        run: python -m pip install --quiet pyyaml

      - name: 仓库门禁
        run: bash scripts/check.sh

      - name: 安装脚本冒烟测试
        run: bash scripts/smoke-install.sh

      - name: 版本提取门禁用例
        run: bash easydev/tests/cases/version-gate/run.sh

      - name: 独立设计环节确定性复验
        run: bash easydev/tests/cases/design-gate/run.sh

      - name: 固定补丁复验
        timeout-minutes: 5
        working-directory: easydev
        run: bash tests/cases/public-contract-callers/run.sh

      - name: 行为 runner 与进程清理回归
        timeout-minutes: 10
        working-directory: easydev
        run: python3 -m unittest discover -s tests/experiments/agent_runner -p 'test_*.py'

      - name: SWE-bench runner 与事件归因回归
        timeout-minutes: 10
        working-directory: easydev
        run: python3 -m unittest discover -s tests/experiments/swebench -p 'test_*.py'
