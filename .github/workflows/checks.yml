name: checks

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyYAML（缺失时 check.sh 会降级为严格校验）
        run: python -m pip install --quiet pyyaml

      - name: 仓库门禁
        run: bash scripts/check.sh

      - name: 安装脚本冒烟测试
        run: bash scripts/smoke-install.sh
