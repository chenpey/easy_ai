[pytest]
# `agent_runner/test_cli.py` 与 `swebench/test_cli.py` 同名且两目录都没有 `__init__.py`，
# 默认 prepend 导入模式在仓库根收集时会因模块名冲突直接报错。importlib 模式按路径
# 导入，`python3 -m pytest` 才是能跑全量的唯一入口。
addopts = --import-mode=importlib
# 测试类沿用仓库既有命名（`*Tests` / `*Test` / `*Case`），pytest 默认只收集 `Test*`。
python_classes = Test* *Tests *Test *Case
